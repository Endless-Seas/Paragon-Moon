name: BYOND Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-linters:
    name: Run Linters
    uses: ./.github/workflows/run_linters.yml

  build:
    name: Windows BYOND and TGUI
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools/bootstrap/.cache
          key: windows-bootstrap-${{ hashFiles('dependencies.sh') }}
      - name: Compile matched Windows artifacts
        shell: pwsh
        run: ./tools/ci/build.ps1
      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paragon-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            roguetown.dmb
            roguetown.rsc
            tgui/public/*.bundle.*
            tgui/public/*.ttf
            tgui/public/*.min.js
            tgui/public/*.min.css
            rust_g.dll
            dependencies.sh

  frontend:
    name: Frontend contracts
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools/bootstrap/.cache
          key: windows-bootstrap-${{ hashFiles('dependencies.sh') }}
      - name: Type check, lint and test all maintained UI sources
        shell: pwsh
        run: |
          & tools/build/build.bat --ci tgui-tsc tgui-eslint tgui-test
          exit $LASTEXITCODE
